# Local infrastructure + containerised API/admin.
#   docker compose up -d postgres redis        # infrastructure only (typical dev)
#   docker compose --profile app up --build     # everything
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meddexa
      POSTGRES_PASSWORD: meddexa
      POSTGRES_DB: meddexa
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meddexa"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for product images and document mirrors.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: meddexa
      MINIO_ROOT_PASSWORD: meddexa-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    profiles: ["storage", "app"]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: ["app"]
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://meddexa:meddexa@postgres:5432/meddexa?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3001,http://localhost:8081
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  admin:
    build: { context: ., dockerfile: apps/admin/Dockerfile }
    profiles: ["app"]
    environment:
      API_URL: http://api:3000
    ports: ["3001:3001"]
    depends_on: [api]

volumes:
  pgdata:
  minio:
