name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: meddexa_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/meddexa_test
      DATABASE_URL: postgresql://postgres@localhost:5432/meddexa_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meddexa/shared build
      - name: Shared — typecheck and tests (comparison engine)
        run: pnpm --filter @meddexa/shared typecheck && pnpm --filter @meddexa/shared test
      - name: API — generate client, typecheck, lint
        working-directory: apps/api
        run: npx prisma generate && npx tsc --noEmit && npx eslint "src/**/*.ts" "test/**/*.ts"
      - name: API — migration check (prisma migrate deploy on a clean database)
        working-directory: apps/api
        run: |
          psql postgresql://postgres@localhost:5432/postgres -c "CREATE DATABASE migrate_check"
          DATABASE_URL=postgresql://postgres@localhost:5432/migrate_check npx prisma migrate deploy
      - name: API — unit and e2e tests
        working-directory: apps/api
        run: npx jest --runInBand
      - name: API — build and OpenAPI export
        working-directory: apps/api
        run: npx nest build && JWT_ACCESS_SECRET=ci-secret-ci-secret-ci-secret-ci-secret npx ts-node --transpile-only scripts/export-openapi.ts

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meddexa/shared build
      - working-directory: apps/admin
        run: npx tsc --noEmit && NEXT_TELEMETRY_DISABLED=1 npx next build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meddexa/shared build
      - working-directory: apps/mobile
        run: npx tsc --noEmit && npx eslint src && npx jest
      - name: Bundle check (web export)
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist-ci

  eas-build:
    # Manual: builds Android/iOS binaries on Expo's build service. Requires EXPO_TOKEN.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[eas]')
    needs: [mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - run: pnpm install --frozen-lockfile && pnpm --filter @meddexa/shared build
      - working-directory: apps/mobile
        run: eas build --platform all --profile preview --non-interactive --no-wait
